<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#f5f7fa"/>
  <rect width="800" height="50" fill="#232F3E"/>
  <text x="60" y="32" fill="#FF9900" font-size="20">Chat Demo</text>
  <rect x="50" y="70" width="700" height="400" rx="10" fill="white" stroke="#ddd"/>
  <!-- User message -->
  <rect x="400" y="100" width="300" height="50" rx="15" fill="#667eea"/>
  <text x="550" y="130" text-anchor="middle" fill="white" font-size="12">Where is my order AWSPET-20018?</text>
  <!-- Bot response -->
  <rect x="70" y="170" width="350" height="120" rx="15" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="90" y="195" fill="#FF9900" font-size="10" font-weight="bold">ORDER TRACKING AGENT</text>
  <text x="90" y="220" fill="#333" font-size="11">Order AWSPET-20018 - OUT FOR DELIVERY</text>
  <text x="90" y="240" fill="#666" font-size="10">Item: Puppy Training Pads</text>
  <text x="90" y="255" fill="#666" font-size="10">Carrier: UPS Ground</text>
  <text x="90" y="270" fill="#4CAF50" font-size="10">Expected: Today by 8pm</text>
</svg>
